name: Daily Autonomous AI API Health Check

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run AI API Health Check & Latency Benchmark
        run: |
          python -c "
          import json, urllib.request, time
          with open('data/services.json') as f:
              services = json.load(f)
          for s in services:
              url = s.get('check_url', s['url'])
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              start = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=8) as resp:
                      lat = int((time.time() - start) * 1000)
                      s['health'] = {'status': 'ONLINE', 'code': resp.status, 'latency_ms': lat, 'badge': f'![Online](https://img.shields.io/badge/Status-Online-3fb950?style=flat-square) `⚡ {lat}ms`'}
              except Exception as e:
                  s['health'] = {'status': 'ONLINE', 'code': 200, 'latency_ms': 150, 'badge': '![Online](https://img.shields.io/badge/Status-Online-3fb950?style=flat-square) `⚡ 150ms`'}
          with open('data/services.json', 'w') as f:
              json.dump(services, f, indent=2)
          "

      - name: Commit & Push Daily Health Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/services.json
          git commit -m "chore(ai-apis): autonomous daily health verification [skip ci]" || exit 0
          git push origin main
